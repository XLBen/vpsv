<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>美术工作室</title>
    <style>
      :root {
        --bg: #1d1824; --panel: #2b2233; --line: #463a52; --text: #f4ecf0; --dim: #9a8ca3; --accent: #f5c542;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
      aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
      aside input { width: 100%; padding: 6px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
      aside h3 { margin: 14px 0 4px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
      aside button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 3px 6px; border-radius: 4px; cursor: pointer; font: 12px ui-monospace, monospace; }
      aside button:hover { background: var(--line); }
      aside button.on { background: var(--accent); color: #14101c; }
      main { overflow: auto; padding: 20px 24px; }
      h1 { margin: 0 0 4px; font-size: 18px; }
      .meta { color: var(--dim); font: 12px ui-monospace, monospace; margin-bottom: 16px; }
      .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
      .toolbar label { color: var(--dim); }
      .clip { margin-bottom: 18px; }
      .clip-title { color: var(--accent); font: 12px ui-monospace, monospace; margin-bottom: 6px; }
      .stage { display: inline-block; background: repeating-conic-gradient(#3a3046 0 25%, #322a3d 0 50%) 0 0 / 16px 16px; padding: 8px; border-radius: 6px; }
      .stage svg { image-rendering: pixelated; }
      .exported img { image-rendering: pixelated; background: repeating-conic-gradient(#3a3046 0 25%, #322a3d 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
      .motion-stage { position: relative; background: #14101c; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .swatches { display: flex; }
      .swatches div { width: 40px; height: 40px; }
      .hint { color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <aside>
      <input id="filter" placeholder="筛选 id…" />
      <div id="list"></div>
    </aside>
    <main id="main"><p class="hint">从左侧选择一个素材。改动 src/assets 下的文件会自动刷新；执行 <code>pnpm export</code> 导出到 Godot。</p></main>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
